<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section id="login">

                <div id="imagem">
                </div>

                <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente! Faça seu login para acessar sua contar</p>
                
                <form action="login.php" method="post" autcomplete="on">
                <p>
                    <label for="iemail">Email: </label>
                    <input type="email" id="iemail" name="email" autocomplete="email" placeholder="Digite o seu e-mail" size="20" required>
                </p>
                
                <p>
                    <label for="isenha">Senha: </label>
                    <input type="password" id="isenha" name="senha" autocomplete="current-password" placeholder="Digite sua senha" size="15" required>
                    </label>
                </p>

    
            </form>
            </div>

        </section>
    </main>
</body>
</html>
